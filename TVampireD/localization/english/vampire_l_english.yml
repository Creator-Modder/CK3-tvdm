# (Original)Vampire Traits and Effects Localization

    trait_vampire:0 "Vampire"
    trait_vampire_desc:0 "A vampire. Possessing immense strength, speed, and perception, all senses hightened, immortal and cannot fall to disease."
    trait_vampire_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a vampire, experiencing the strengths, speed, and cunning that come with vampirism. [ROOT.GetCharacter.GetSheHe] walks among mortals forever fighting a vampire's predatory nature or embracing it."
    vampire:0 "Vampire"

    trait_track_vampire:0 "Vampiric Mastery"
    trait_track_vampire_desc:0 "As centuries pass, this vampire grows stronger and more experienced in their newfound supernatural existance."
   
    trait_original_vampire:0 "Original Vampire"
    trait_original_vampire_desc:0 "One of the first. An ancient vampire of unimaginable power, impossible to kill by normal means."
    trait_original_vampire_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is one of the Original Vampires — ancient, powerful, and nearly unstoppable. The blood of all vampires can be traced back to [ROOT.GetCharacter.GetHerHim], and [ROOT.GetCharacter.GetHerHis] presence exudes supernatural authority."

    trait_original_hybrid:0 "Original Hybrid"
    trait_original_hybrid_desc:0 "The very first vampire/werewolf hybrid, The Original Hybrid, though cursed to keep the werewolf side dormant, [ROOT.GetCharacter.GetSheHe] is still the most powerful being in existence."
    trait_original_hybrid_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is an Original Hybrid, and that is all that needs to be said."

# Compelled Trait Localization
 
    trait_compelled:0 "Compelled"
    trait_compelled_desc:0 "This character is under a vampire's compulsion. Their will is not completely their own, but they feel strangely confident and energized by their supernatural bond."
    trait_compelled_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has been compelled by a vampire. Though [ROOT.GetCharacter.GetSheHe] retains most of [ROOT.GetCharacter.GetHerHis] faculties, [ROOT.GetCharacter.GetSheHe] feels an unnatural loyalty and finds [ROOT.GetCharacter.GetHerselfHimself] acting with newfound confidence and boldness."

# Original Compelled Trait Localization

    trait_original_compelled:0 "Compelled by Original Vampire"
    trait_original_compelled_desc:0 "This character is under the compulsion of an Original Vampire. Their will is significantly influenced, and they feel a deep, loyal connection to their master."
    trait_original_compelled_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has been compelled by an Original Vampire. The bond is powerful and unbreakable, granting [ROOT.GetCharacter.GetHerHim] a sense of purpose and obedience that transcends ordinary loyalty."

# Vampire Interaction Compulsion Localization

    vampire_compulsion_interaction:0 "Vampiric Compulsion"
    vampire_compulsion_interaction_desc:0 "Use your vampiric compulsion on [recipient.GetShortUIName]. They will become bound to your will, unable to resist your commands."

# Original Vampire Compulsion Interaction Localization

    original_vampire_compulsion_interaction:0 "An Original Vampire's Compulsion"
    original_vampire_compulsion_interaction_desc:0 "As an Original Vampire, use your superior compulsion abilities on [recipient.GetShortUIName]. Your compulsion powers can bend even other normal vampires to your will."

# Opinion Modifiers for compulsions

    compelled_opinion:0 "Compelled by Vampire"

# Turn Vampire Interaction Localization

    turn_vampire_interaction:0 "Turn into a Vampire"
    turn_vampire_interaction_desc:0 "Offer to turn [recipient.GetShortUIName] into a vampire. If they accept, they will become a new vampire, gaining all the powers and urges that come with it."
  
# Vampire Disease Immunity Events

    vampire_immunity.0001.t:0 "Vampiric Regeneration"
    vampire_immunity.0001.desc:0 "Your supernatural vampiric nature purges all ailments from your immortal body, healing wounds and curing diseases with preternatural speed."

# Vampire Age Visual Maintenance

    vampire_age_maintenance.0004.t:0 "A Timeless Reflection"
    vampire_age_maintenance.0004.desc:0 "Your appearance remains perfectly preserved, unaffected by time or decay. The illusion of youth holds steady — just as it always should."


# Interaction for blood healing


    offer_vampire_blood_healing: "Offer Vampire Blood For Healing"
    offer_vampire_blood_healing_desc: "Offer your vampire blood to heal [recipient.GetTitledFirstName]'s ailments and diseases."
 
# Events for blood healing

    vampire_blood_healing.0001.t: "Healing Blood"
    vampire_blood_healing.0001.desc: "I have offered to heal [scope:recipient.GetTitledFirstName] with my vampiric blood. My blood can cure diseases and mend injuries, but what should I ask for in return for this miraculous gift?"
 
    vampire_blood_healing.0001.a: "Ask for Gold"
    vampire_blood_healing.0001.b: "Ask for Prestige"
    vampire_blood_healing.0001.c: "Ask for Piety"
    vampire_blood_healing.0001.d: "Ask for Loyalty and Service"
    vampire_blood_healing.0001.e: "Ask for Friendship and a Favor"
 
# Modifiers for blood healing

    vampire_blood_dealer: "Vampire Blood Dealer"
    vampire_blood_dealer_desc: "This character is known for trading vampiric blood for payment, gaining some prestige but losing piety for the unholy practice."
 
    vampire_blood_debt: "Blood Debt"
    vampire_blood_debt_desc: "This character owes their life to a vampire's healing blood and feels obligated to pay them back."
 
