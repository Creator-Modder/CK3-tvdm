    supernatural_msg_tooltip_adopt_into_house_desc:0 "[THIS.GetCharacter.GetFirstNameNoTooltip] будет усыновлён и получит право на наследство в доме [actor.GetHouse.GetName]."
    SUPERNATURAL_OFFER_ADOPTION_INTERACTION_NOTIFICATION:0 "Я предлагаю усыновить тебя в дом [actor.GetHouse.GetName]."
