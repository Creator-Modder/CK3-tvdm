# Intro event
 tvampired.0001.t:0 "The Ultimate Vampire Mod"
 tvampired.0001.desc:0 "Welcome to my vampire mod for Crusader Kings III!\n\nThis mod brings the most logically implemented vampires into your medieval world. Experience immortality, supernatural powers, bloodlines, and all the drama that comes with the supernatural.\n\nPrepare yourself for a world where the night belongs to creatures far older and more dangerous than any mortal ruler.\n\nEnjoy the mod! also I'm a newbie mod creator so forgive any shortcomings and errors, what you will see is a very basic mod, so if you want to edit it, change things, add stuff, or fix things, you are very much welcome to it.\n\nI also have no idea if it will work or conflict with any other mods."
 tvampired.0001.a:0 "Thanks for trying it"

# Vampire Army
 vampire_army:0 "Vampire Army"
 vampire_army_flavor:0 "A fearsome force of New Vampires, the Vampire Army strikes terror into the hearts of any who dare to be their enemies. With their supernatural strength and agility, they are a formidable presence on the battlefield."



# Decision to become an Original Vampire
 become_original_vampire_decision:0 "Become an Original Vampire"
 become_original_vampire_decision_desc:0 "The time has come to embrace immortality and power beyond mortal comprehension. With the aid of a powerful witch's ancient knowledge, I can undergo the irreversible transformation with a spell that will make me an Original Vampire - blessed and cursed with eternal life, supernatural strength, and an insatiable hunger for blood."
 become_original_vampire_decision_tooltip:0 "You can start the spell to become an Original Vampire"
 
 # Confirmation
 BECOME_ORIGINAL_VAMPIRE_DECISION_CONFIRM_TITLE:0 "Embrace the Darkness?"
 BECOME_ORIGINAL_VAMPIRE_DECISION_CONFIRM_DESC:0 "Are you certain you wish to undergo this irreversible transformation? Once you become an original vampire, there will be no turning back to your mortal life."
 BECOME_ORIGINAL_VAMPIRE_DECISION_CONFIRM_ACCEPT:0 "Embrace Immortality"
 become_original_vampire_decision_confirm:0 "Begin the Ritual"

 # Event
 vampire_transformation.0001.t:0 "The Transformation"
 vampire_transformation.0001.desc:0 "As the witch's incantations faded into the night, I drove the blade into my heart. My breath faltered, my soul slipped away... \n\nWhen I awoke, the witch had prepared blood for me. The hunger consumed every thought — so I drank to complete the transition. \n\nIn that instant, everything changed. Heartbeats thundered from every corridor, the scent of mortal blood filled the air, and the darkness revealed itself in perfect clarity. Yet the hunger gnawed still, insatiable and unyielding.  I am no longer human.  I am an Original Vampire — immortal, powerful, and forever changed."
 vampire_transformation.0001.a:0 "I am Reborn"
 vampire_transformation.0001.a.tt:0 "You have become an Original Vampire"
 # Extra loc for the Decision
 any_close_family_member:0 "Has close family that can be trusted:"
 any_courtier_or_guest:0 "A trust worthy friend in your court:"
 