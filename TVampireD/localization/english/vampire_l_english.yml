# Events for turn request
 vampire_turn_request.0001.t:0 "A Request for the Supernatural Gift"
 vampire_turn_request.0001.desc_high_opinion:0 "[actor.GetTitledFirstName] approaches you with a request that few mortals would dare make. Their devotion and respect for you has grown considerably, and now they seek the ultimate boon - to join you in eternity. They believe they have earned your trust and proven themselves worthy of the gift of vampirism."
 vampire_turn_request.0001.desc_strong_hook:0 "[actor.GetTitledFirstName] approaches you with a request for vampirism, and they have leverage over you that makes refusal... difficult. You owe them a significant favor, and they are calling it in for the ultimate prize - immortality itself."
 vampire_turn_request.0001.desc_gold_payment:0 "[actor.GetTitledFirstName] approaches you with a substantial offer of gold in exchange for the gift of vampirism. One thousand pieces of gold - enough to fund armies or build castles - all for some of your blood that would change their mortal life forever."
 vampire_turn_request.0001.desc_insufficient:0 "[actor.GetTitledFirstName] approaches you with a desperate request for vampirism, but they offer little in return beyond their humble plea. They seem to understand this is unlikely to succeed, but desperation drives them to try nonetheless."
 
 vampire_turn_request.0001.a:0 "I like you, so yeah, why not."
 vampire_turn_request.0001.b:0 "I cannot refuse what I owe you. Very well."
 vampire_turn_request.0001.c:0 "Now that's a hefty sum of gold, I will grant your wish."
 vampire_turn_request.0001.d:0 "I refuse. Now leave before I change my mind, and just kill you."
 
 vampire_turn_request.0002.t:0 "The Dark within Awakens"
 vampire_turn_request.0002.desc:0 "The transformation is complete. You feel the supernatural power coursing through your veins, your senses heightened beyond mortal comprehension. The world looks different now - colors more vivid, sounds clearer, and you can hear the heartbeats of mortals around you like drums calling to your newfound hunger. You are no longer human. You are a vampire."
 vampire_turn_request.0002.a:0 "I embrace this power. I am more than I ever was as a mortal."
 vampire_turn_request.0002.b:0 "What the... Is this what being a vampire feels like?"
 vampire_turn_request.0002.c:0 "Not bad, let's see what we can do with this."
################################################# ------------------------------------------------------
 vampire_turn_request.0003.t:0 "The Gift Denied"
 vampire_turn_request.0003.desc:0 "[actor.GetTitledFirstName] has refused your request for vampirism. The sting of rejection burns, knowing that immortality and power were so close yet denied to you. Perhaps in time another opportunity will present itself, or perhaps this was never meant to be your path."
 vampire_turn_request.0003.a:0 "I understand. Perhaps it was not meant for me."
 vampire_turn_request.0003.b:0 "I will not forget this refusal."
################################################# ------------------------------------------------------


