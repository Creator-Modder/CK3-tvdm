    vampire_accepted_house:0 "Согласие вступить в дом"
    vampire_msg_accepted_house_interaction_message:0 "[THIS.GetCharacter.GetFirstNameNoTooltip] принял ваше приглашение и вступил в дом [actor.GetHouse.GetName]."
    vampire_accepted_adoption:0 "Согласие на усыновление"
    vampire_msg_accepted_adoption_interaction_message:0 "[THIS.GetCharacter.GetFirstNameNoTooltip] принял ваше предложение об усыновлении и вступил в дом [actor.GetHouse.GetName]."

# Siring
    vampire_trait_sired_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] был обречён или одарён тьмой вампиризма.\n\n#high Создатель: #!#P [ROOT.GetCharacter.MakeScope.Var('sire_character').GetCharacter.GetName] #!"

