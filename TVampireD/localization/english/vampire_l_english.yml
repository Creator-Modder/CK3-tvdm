    VAMPIRE_HEALER_OPINION_DESC: "Healed me with vampire blood"
    VAMPIRE_LIFE_SAVER_OPINION_DESC: "Saved my life with vampire blood"
    vampire_life_saver_opinion:0 "This vampire saved my life"
    vampire_healer_opinion:0 "This vampire healed me"
    vampire_blood_debt:0 "I'm indebted to this vampire"




