    request_vampire_turn_interaction:0 "Попросить обратить в вампира"
    request_vampire_turn_interaction_desc:0 "Попросите этого вампира даровать вам бессмертие. Это решение изменит вашу сущность навсегда."
    GOLD_PAYMENT_COST:0 "Плата за обращение"
    vampire_turn_request_accept_notification:0 "Запрос на обращение в вампира принят"

    REQUEST_TURN_HIGH_OPINION:0 "Я заслужил твоё доверие и уважение."
    REQUEST_TURN_STRONG_HOOK:0 "Ты обязан мне этой услугой."
    REQUEST_TURN_GOLD_PAYMENT:0 "Я могу предложить щедрую плату (1000 золотых)."
    REQUEST_TURN_INSUFFICIENT:0 "Пожалуйста, я смиренно прошу, хотя мне нечего предложить."

