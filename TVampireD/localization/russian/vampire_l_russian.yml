# Events for turn request
    vampire_turn_request.0001.t:0 "Просьба о тёмном даре"
    vampire_turn_request.0001.desc_high_opinion:0 "[actor.GetTitledFirstName] обращается к вам с просьбой, которую мало кто из смертных осмелился бы произнести. Их уважение и преданность к вам возросли настолько, что теперь они ищут высшую награду — вечность рядом с вами."
    vampire_turn_request.0001.desc_strong_hook:0 "[actor.GetTitledFirstName] просит обратить его, и у него есть рычаг давления, который затрудняет отказ. Вы задолжали ему услугу, и теперь он требует за неё бессмертие."
    vampire_turn_request.0001.desc_gold_payment:0 "[actor.GetTitledFirstName] предлагает вам тысячу золотых монет — цену за ваше обращение, способное изменить его жизнь навсегда."
    vampire_turn_request.0001.desc_insufficient:0 "[actor.GetTitledFirstName] отчаянно просит обратить его, но не предлагает ничего взамен, кроме мольбы. Шансы на успех малы, но отчаяние толкает его попробовать."
    vampire_turn_request.0001.a:0 "Ты мне нравишься, так что почему бы и нет."
    vampire_turn_request.0001.b:0 "Я не могу отказаться от того, что тебе должен. Хорошо."
    vampire_turn_request.0001.c:0 "Такое золото стоит обращения. Будет по-твоему."
    vampire_turn_request.0001.d:0 "Нет. Убирайся, пока я не передумал и не убил тебя."

    vampire_turn_request.0002.t:0 "Пробуждение тьмы"
    vampire_turn_request.0002.desc:0 "Преображение завершено. Сила бурлит в ваших венах, чувства обострились до немыслимого уровня. Мир уже никогда не будет прежним. Вы больше не человек. Вы — вампир."
    vampire_turn_request.0002.a:0 "Я принимаю эту силу. Я больше, чем был смертным."
    vampire_turn_request.0002.b:0 "Что это… Вот таково быть вампиром?"
    vampire_turn_request.0002.c:0 "Неплохо. Посмотрим, что я смогу с этим сделать."

    vampire_turn_request.0003.t:0 "Дар отвергнут"
    vampire_turn_request.0003.desc:0 "[actor.GetTitledFirstName] отказал вам в просьбе об обращении. Жгучее чувство отвержения напоминает, что бессмертие и сила были так близко, но недоступны."
    vampire_turn_request.0003.a:0 "Понимаю. Возможно, это не моё предназначение."
    vampire_turn_request.0003.b:0 "Я этого не забуду."

# Vampire Feeding Interaction Localization
    vampire_feeding_interaction:0 "Накормиться"
    vampire_feeding_interaction_desc:0 "Питайтесь кровью этого человека, чтобы снять стресс и утолить жажду."
    vampire_feeding_prisoner_interaction:0 "Высосать узника досуха"
    vampire_feeding_prisoner_interaction_desc:0 "Полностью высосите кровь из узника и насладитесь своей истинной природой. Его смерть станет устрашающим примером для всех, кто посмеет вам противостоять."

# Modifiers for vampire feeding
    vampire_feeding_boost:0 "Недавнее кормление"
    vampire_feeding_boost_desc:0 "Недавнее кормление усилило ваши сверхъестественные способности до предела."
    blood_loss_weakness:0 "Потеря крови"
    blood_loss_weakness_desc:0 "Этот персонаж ослаблен из-за потери крови."

# Custom tooltips
    vampire_feeding_same_location:0 "Вы должны находиться в одном месте с целью"
    vampire_recently_fed:0 "Вы недавно кормились и пока не нуждаетесь в новой крови"
    recently_fed:0 "Недавно кормился"

# Death reason
    death_drained_killer:0 "Истощён кровопотерей"

# Intro event
    tvampired.0001.t:0 "Ultimate Vampire Mod"
    tvampired.0001.desc:0 "Добро пожаловать в мой мод о вампирах для Crusader Kings III!\n\nЭтот мод добавляет в игру самых логично реализованных вампиров. Испытайте бессмертие, сверхъестественные силы, родовые линии и драму, которая сопутствует сверхъестественному.\n\nПриготовьтесь к миру, где ночь принадлежит существам куда более древним и опасным, чем любой смертный правитель.\n\nНаслаждайтесь модом! Я начинающий модмейкер, так что прошу прощения за возможные ошибки и недочёты. То, что вы увидите — лишь основа. Если хотите редактировать, менять, добавлять или исправлять — милости прошу."
    tvampired.0001.a:0 "Спасибо за мод!"

# Vampire Army
    vampire_army:0 "Вампирская армия"
    vampire_army_flavor:0 "Грозная армия новообращённых вампиров, наводящая ужас на сердца врагов. Их сила и скорость делают их грозной силой на поле боя."

# Decision to become an Original Vampire
    become_original_vampire_decision:0 "Стать Первородным вампиром"
    become_original_vampire_decision_desc:0 "Пришло время обрести бессмертие и силу за пределами человеческого понимания. С помощью ведьмы и древнего заклинания я могу пройти необратимое превращение, став Первородным вампиром — благословлённым и проклятым вечной жаждой крови."
    become_original_vampire_decision_tooltip:0 "Вы можете начать ритуал превращения в Первородного вампира"

# Confirmation
    BECOME_ORIGINAL_VAMPIRE_DECISION_CONFIRM_TITLE:0 "Принять тьму?"
    BECOME_ORIGINAL_VAMPIRE_DECISION_CONFIRM_DESC:0 "Вы уверены, что хотите пройти это необратимое превращение? Став Первородным вампиром, вы больше никогда не вернётесь к человеческой жизни."
    BECOME_ORIGINAL_VAMPIRE_DECISION_CONFIRM_ACCEPT:0 "Принять бессмертие"
    become_original_vampire_decision_confirm:0 "Начать ритуал"

# Event
    vampire_transformation.0001.t:0 "Преображение"
    vampire_transformation.0001.desc:0 "Когда заклинания ведьмы стихли в ночи, я вонзил клинок в сердце. Дыхание оборвалось, душа покинула тело… \n\nКогда я проснулся, ведьма приготовила для меня кровь. Жажда поглотила все мысли — и я выпил, завершив обращение. \n\nВ тот миг всё изменилось: удары сердец звучали в каждом коридоре, запах крови наполнял воздух, а тьма раскрывалась в идеальной ясности. Но жажда осталась — неутолимая и вечная. Я больше не человек. Я Первородный вампир — бессмертный, могущественный и навсегда изменённый."
    vampire_transformation.0001.a:0 "Я возродился"
    vampire_transformation.0001.a.tt:0 "Вы стали Первородным вампиром"

# Extra loc for Decision
    any_close_family_member:0 "Есть близкий родственник, которому можно доверять:"
    any_courtier_or_guest:0 "Есть друг в вашем дворе:"
