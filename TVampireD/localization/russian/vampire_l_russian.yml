# (Original)Vampire Traits and Effects Localization - Russian

    trait_vampire:0 "Вампир"
    trait_vampire_desc:0 "Вампир. Обладает невероятной силой, скоростью и обострёнными чувствами. Бессмертен и невосприимчив к болезням."
    trait_vampire_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — вампир, обладающий силой, скоростью и хитростью, что дарует вампиризм. [ROOT.GetCharacter.GetSheHe] живёт среди смертных, вечно борясь с хищной природой вампира или же принимая её."
    vampire:0 "Вампир"

    trait_track_vampire:0 "Мастерство вампира"
    trait_track_vampire_desc:0 "С веками этот вампир становится сильнее и опытнее в своей новой сверхъестественной сущности."

    trait_original_vampire:0 "Первородный вампир"
    trait_original_vampire_desc:0 "Один из первых. Древний вампир невообразимой силы, невозможный для убийства обычными средствами."
    trait_original_vampire_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — один из Первородных вампиров: древний, могущественный и почти неудержимый. Кровь всех вампиров восходит к [ROOT.GetCharacter.GetHerHim], а [ROOT.GetCharacter.GetHerHis] присутствие излучает сверхъестественный авторитет."

    trait_original_hybrid:0 "Первородный гибрид"
    trait_original_hybrid_desc:0 "Первый в мире гибрид вампира и оборотня. Несмотря на проклятие, удерживающее звериную сущность спящей, [ROOT.GetCharacter.GetSheHe] всё же остаётся самым могущественным существом."
    trait_original_hybrid_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — Первородный гибрид, и этим всё сказано."

# Compelled Trait Localization
    trait_compelled:0 "Под внушением"
    trait_compelled_desc:0 "Этот персонаж находится под внушением вампира. Его воля не полностью принадлежит ему самому, но он ощущает странную уверенность и силу благодаря этой сверхъестественной связи."
    trait_compelled_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] находится под внушением вампира. Хотя [ROOT.GetCharacter.GetSheHe] сохранил большинство своих способностей, [ROOT.GetCharacter.GetSheHe] чувствует неестественную преданность и действует с новой уверенностью и смелостью."

# Original Compelled Trait Localization
    trait_original_compelled:0 "Внушение Первородного"
    trait_original_compelled_desc:0 "Этот персонаж находится под внушением Первородного вампира. Его воля сильно подавлена, и он чувствует глубокую, непреломимую связь со своим хозяином."
    trait_original_compelled_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] находится под внушением Первородного вампира. Эта связь могущественна и нерушима, даруя [ROOT.GetCharacter.GetHerHim] чувство цели и покорности, превосходящее обычную преданность."

# Vampire Interaction Compulsion Localization
    vampire_compulsion_interaction:0 "Вампирское внушение"
    vampire_compulsion_interaction_desc:0 "Используйте своё вампирское внушение на [recipient.GetShortUIName]. Он подчинится вашей воле и не сможет сопротивляться приказам."

# Original Vampire Compulsion Interaction Localization
    original_vampire_compulsion_interaction:0 "Внушение Первородного"
    original_vampire_compulsion_interaction_desc:0 "Будучи Первородным вампиром, используйте своё превосходное внушение на [recipient.GetShortUIName]. Ваша власть способна подчинить даже обычных вампиров."

# Opinion Modifiers for compulsions
    compelled_opinion:0 "Под внушением вампира"

# Turn Vampire Interaction Localization
    turn_vampire_interaction:0 "Обратить в вампира"
    turn_vampire_interaction_desc:0 "Предложите обратить [recipient.GetShortUIName] в вампира. Если он согласится, то станет новым вампиром, обретя все силы и жажду крови."

# Vampire Disease Immunity Events
    vampire_immunity.0001.t:0 "Вампирская регенерация"
    vampire_immunity.0001.desc:0 "Сверхъестественная природа вашего тела изгоняет все недуги, исцеляя раны и излечивая болезни с невероятной скоростью."

# Vampire Age Visual Maintenance
    vampire_age_maintenance.0004.t:0 "Вневременное отражение"
    vampire_age_maintenance.0004.desc:0 "Ваш облик остаётся безупречным, неподвластным времени и тлению. Иллюзия юности не меркнет — как и должно быть."
    
# Interaction for blood healing
    offer_vampire_blood_healing:0 "Предложить кровь для исцеления"
    offer_vampire_blood_healing_desc:0 "Предложите свою вампирскую кровь, чтобы исцелить недуги и болезни [recipient.GetTitledFirstName]."

# Events for blood healing
    vampire_blood_healing.0001.t:0 "Целительная кровь"
    vampire_blood_healing.0001.desc:0 "Я предложил исцелить [scope:recipient.GetTitledFirstName] своей кровью. Она способна излечить болезни и залечить раны. Но что я должен потребовать взамен за этот дар?"
    vampire_blood_healing.0001.a:0 "Попросить золото"
    vampire_blood_healing.0001.b:0 "Попросить престиж"
    vampire_blood_healing.0001.c:0 "Попросить благочестие"
    vampire_blood_healing.0001.d:0 "Попросить верность и службу"
    vampire_blood_healing.0001.e:0 "Попросить дружбу и услугу"

# Modifiers for blood healing
    vampire_blood_dealer:0 "Торговец кровью"
    vampire_blood_dealer_desc:0 "Этот персонаж известен тем, что обменивает свою кровь на плату. Это приносит ему престиж, но снижает благочестие из-за нечестивой практики."
    vampire_blood_debt:0 "Долг крови"
    vampire_blood_debt_desc:0 "Этот персонаж обязан жизнью вампиру и чувствует себя обязанным вернуть долг."

# Opinion modifiers for blood healing
    VAMPIRE_HEALER_OPINION_DESC:0 "Исцелил меня своей кровью"
    VAMPIRE_LIFE_SAVER_OPINION_DESC:0 "Спас мою жизнь своей кровью"
    vampire_life_saver_opinion:0 "Этот вампир спас мою жизнь"
    vampire_healer_opinion:0 "Этот вампир исцелил меня"
    vampire_blood_debt:0 "Я в долгу перед этим вампиром"

# Invite to Join House
    supernatural_invite_join_house:0 "Пригласить в дом"
    supernatural_invite_join_house_interaction_desc:0 "Пригласить вступить в дом [actor.GetHouse.GetName]."
    supernatural_msg_tooltip_invite_join_house_desc:0 "[THIS.GetCharacter.GetFirstNameNoTooltip] станет членом дома [actor.GetHouse.GetName]."
    SUPERNATURAL_OFFER_JOIN_HOUSE_INTERACTION_NOTIFICATION:0 "Я приглашаю вас вступить в дом [actor.GetHouse.GetName]."

